<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Knolling motion — Mark A</title>
<style>
  html, body { margin:0; height:100%; background:#F2F4F6; display:flex; align-items:center; justify-content:center; font-family:sans-serif; }
  .stage { display:flex; flex-direction:column; align-items:center; gap:20px; }
  .box { width:240px; height:240px; }
  svg { overflow:visible; }
  .part { transform-box: fill-box; transform-origin:center; animation-duration:700ms; animation-timing-function: cubic-bezier(.22,.61,.32,1); animation-iteration-count:1; animation-fill-mode:forwards; }
  .p1 { animation-name:p1; }
  .p2 { animation-name:p2; animation-delay:.09s; }
  .p3 { animation-name:p3; animation-delay:.18s; }
  .p4 { animation-name:p4; animation-delay:.27s; }
  @keyframes p1 { 0%{transform:translate(-18px,-22px) rotate(-10deg);} 100%{transform:none;} }
  @keyframes p2 { 0%{transform:translate(20px,-14px) rotate(7deg);} 100%{transform:none;} }
  @keyframes p3 { 0%{transform:translate(-16px,18px) rotate(11deg);} 100%{transform:none;} }
  @keyframes p4 { 0%{transform:translate(18px,20px) rotate(-8deg);} 100%{transform:none;} }
  .caption { font-family: 'Space Mono', monospace; font-size:12px; color:#616B75; }
</style>
</head>
<body>
<div class="stage">
  <div class="box">
    <svg viewBox="-24 -24 80 80" width="100%" height="100%">
      <g class="part p1"><rect x="1" y="1" width="13" height="13" rx="1.5" fill="#1F2429"/></g>
      <g class="part p2"><rect x="18" y="1" width="13" height="13" rx="1.5" fill="#1F2429"/></g>
      <g class="part p3"><rect x="1" y="18" width="13" height="13" rx="1.5" fill="#1F2429"/></g>
      <g class="part p4"><rect x="18" y="18" width="13" height="13" rx="1.5" fill="#A6792E"/></g>
    </svg>
  </div>
  <div class="caption">plays once on load, then holds knolled — as it would as the nav/header logo</div>
</div>
</body>
</html>
